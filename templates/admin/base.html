<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}管理后台{% endblock %} · HNTV</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
{% if session.get('admin') %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/admin">HNTV 管理后台</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link {{ 'active' if active == 'dashboard' }}" href="/admin">仪表盘</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if active == 'sources' }}" href="/admin/sources">源管理</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if active == 'channels' }}" href="/admin/channels">频道管理</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if active == 'monitor' }}" href="/admin/monitor">监控</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if active == 'logs' }}" href="/admin/logs">日志</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if active == 'settings' }}" href="/admin/settings">设置</a></li>
      </ul>
      <button class="btn btn-outline-light btn-sm" id="logoutBtn">退出登录</button>
    </div>
  </div>
</nav>
{% endif %}
<div class="container-fluid px-4 pb-5">
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ===== 共享工具 ===== */

/* 请求管理 API：自动带 JSON 头，401 跳登录页，非 2xx 抛 error 文案 */
async function api(path, method = 'GET', body = null) {
  const opts = {method, headers: {'Content-Type': 'application/json'}};
  if (body !== null) opts.body = JSON.stringify(body);
  const resp = await fetch(path, opts);
  if (resp.status === 401) { location.href = '/admin/login'; throw new Error('未登录'); }
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));
  return data;
}

/* HTML 转义：所有动态数据进 innerHTML 前必须过 esc()，防 XSS */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => (
    {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
}

/* 通用分页条：container=DOM 元素，data=API 包裹，load(page)=回调 */
function renderPager(container, data, load) {
  const totalPages = Math.max(1, Math.ceil(data.total / data.page_size));
  const page = data.page;
  // 页码窗口：首页 / 当前±1 / 末页（去重排序，最多 5 个数字钮）
  const pages = [...new Set([1, page - 1, page, page + 1, totalPages])]
    .filter(p => p >= 1 && p <= totalPages).sort((a, b) => a - b);
  container.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'btn-group btn-group-sm flex-wrap';
  let html = `<button class="btn btn-outline-secondary" data-p="${page - 1}" ${page <= 1 ? 'disabled' : ''}>«</button>`;
  pages.forEach(p => {
    html += `<button class="btn ${p === page ? 'btn-primary' : 'btn-outline-secondary'}" data-p="${p}">${p}</button>`;
  });
  html += `<button class="btn btn-outline-secondary" data-p="${page + 1}" ${page >= totalPages ? 'disabled' : ''}>»</button>`;
  html += `<span class="btn btn-outline-secondary disabled">共 ${data.total} 条</span>`;
  wrap.innerHTML = html;
  wrap.querySelectorAll('button[data-p]').forEach(b => b.addEventListener('click', () => load(Number(b.dataset.p))));
  container.appendChild(wrap);
}

/* 顶部提示条：success/error */
function toast(msg, ok = true) {
  const box = document.getElementById('alertBox');
  if (!box) { alert(msg); return; }
  box.innerHTML = `<div class="alert alert-${ok ? 'success' : 'danger'} alert-dismissible fade show mb-3">`
    + esc(msg) + `<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`;
}

/* 退出登录 */
document.getElementById('logoutBtn')?.addEventListener('click', async () => {
  try { await fetch('/api/admin/logout', {method: 'POST'}); } catch (e) {}
  location.href = '/admin/login';
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
