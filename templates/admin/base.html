<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}管理后台{% endblock %} · HNTV</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root { --brand: #4f6ef7; }
    body { background: #f4f6fb; }
    .navbar { background: linear-gradient(90deg, #232733, #2c3350); box-shadow: 0 2px 10px rgba(0,0,0,.15); }
    .navbar-brand { font-weight: 700; letter-spacing: .5px; }
    .navbar .nav-link { border-radius: .5rem; padding: .4rem .9rem; }
    .navbar .nav-link.active { background: rgba(255,255,255,.14); }
    .card { border: none; border-radius: .8rem; box-shadow: 0 1px 4px rgba(20,30,60,.06); }
    .card-header { background: transparent; font-weight: 600; border-bottom: 1px solid #eef1f7; }
    .stat-icon { width: 46px; height: 46px; border-radius: .8rem; display: flex; align-items: center;
                 justify-content: center; font-size: 1.35rem; flex: none; }
    .table > :not(caption) > * > * { vertical-align: middle; }
    .table thead th { white-space: nowrap; color: #7a8499; font-weight: 600; font-size: .82rem;
                      text-transform: uppercase; letter-spacing: .3px; border-bottom-width: 1px; }
    .table-hover tbody tr:hover { background: #f2f5ff; }
    .empty-state { text-align: center; color: #9aa3b5; padding: 2.2rem 0; }
    .empty-state i { font-size: 2.2rem; display: block; margin-bottom: .5rem; opacity: .6; }
    .btn-soft { border: none; background: #eef2ff; color: var(--brand); }
    .btn-soft:hover { background: #e0e7ff; color: #3b5cf0; }
    .modal-content { border: none; border-radius: .9rem; }
    .form-text { font-size: .78rem; }
    .page-title { font-size: 1.25rem; font-weight: 700; }
    .toast-container { position: fixed; top: 1rem; right: 1rem; z-index: 1090; }

    /* ===== 移动端通用优化 ===== */
    /* 超窄屏容器收紧边距 */
    @media (max-width: 575.98px) { .container-fluid.content-x { padding: 0 .75rem !important; } }
    /* 窄屏触控目标：按钮/分页/链接加大，便于手指点击 */
    @media (max-width: 767.98px) {
      .btn-sm, .btn-group-sm .btn, .navbar .nav-link { min-height: 40px; }
      .form-control-sm, .input-group-sm .form-control { min-height: 40px; }
      .btn-group-sm .btn { padding: .4rem .65rem; }
    }
    /* 长链接/长文本：窄屏单行省略 + 悬浮全文，桌面保留可换行（可读性） */
    .text-ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @media (min-width: 768px) {
      .text-ellipsis-md { white-space: normal; overflow-wrap: anywhere; }
    }
    /* 点击可复制的链接样式 */
    .copyable { cursor: pointer; text-decoration: none; }
    .copyable:hover { text-decoration: underline; }
    .copyable .bi { font-size: .8em; margin-left: 2px; opacity: .75; }
    /* 移动端 Toast：底部居中全宽，避免被顶部状态栏遮挡 */
    @media (max-width: 575.98px) {
      .toast-container { top: auto; bottom: 1rem; left: .75rem; right: .75rem; }
      .toast-container .toast { width: 100%; max-width: none; }
    }
    /* 窄屏 modal 全宽贴边，便于操作 */
    @media (max-width: 575.98px) {
      .modal-dialog { margin: .5rem; }
    }
  </style>
</head>
<body>
{% if session.get('admin') %}
<nav class="navbar navbar-expand-lg navbar-dark mb-4">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="/admin"><i class="bi bi-broadcast-pin me-2"></i>HNTV 管理后台</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto gap-lg-1">
        <li class="nav-item"><a class="nav-link {{ 'active' if active == 'dashboard' }}" href="/admin"><i class="bi bi-speedometer2 me-1"></i>仪表盘</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if active == 'sources' }}" href="/admin/sources"><i class="bi bi-rss me-1"></i>源管理</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if active == 'channels' }}" href="/admin/channels"><i class="bi bi-tv me-1"></i>频道管理</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if active == 'monitor' }}" href="/admin/monitor"><i class="bi bi-activity me-1"></i>监控</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if active == 'logs' }}" href="/admin/logs"><i class="bi bi-journal-text me-1"></i>日志</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if active == 'settings' }}" href="/admin/settings"><i class="bi bi-gear me-1"></i>设置</a></li>
      </ul>
      <button class="btn btn-outline-light btn-sm" id="logoutBtn"><i class="bi bi-box-arrow-right me-1"></i>退出登录</button>
    </div>
  </div>
</nav>
{% endif %}

<!-- 右上角 Toast 容器 -->
<div class="toast-container" id="toastBox"></div>

<div class="container-fluid content-x px-4 pb-5">
  {% block content %}{% endblock %}
</div>

<!-- 通用确认弹窗 -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0">
        <h6 class="modal-title fw-bold" id="confirmTitle">确认操作</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="confirmMessage"></div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-primary btn-sm" id="confirmOkBtn">确定</button>
      </div>
    </div>
  </div>
</div>

<!-- 通用表单弹窗（动态字段） -->
<div class="modal fade" id="formModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0">
        <h6 class="modal-title fw-bold" id="formTitle">编辑</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="formBody"></div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-primary btn-sm" id="formOkBtn">保存</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ===== 共享工具 ===== */

/* 请求管理 API：自动带 JSON 头，401 跳登录页，非 2xx 抛 error 文案 */
async function api(path, method = 'GET', body = null) {
  const opts = {method, headers: {'Content-Type': 'application/json'}};
  if (body !== null) opts.body = JSON.stringify(body);
  const resp = await fetch(path, opts);
  if (resp.status === 401) { location.href = '/admin/login'; throw new Error('未登录'); }
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));
  return data;
}

/* HTML 转义：所有动态数据进 innerHTML 前必须过 esc()，防 XSS */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => (
    {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
}

/* 通用分页条：container=DOM 元素，data=API 包裹，load(page)=回调 */
function renderPager(container, data, load) {
  const totalPages = Math.max(1, Math.ceil(data.total / data.page_size));
  const page = data.page;
  const pages = [...new Set([1, page - 1, page, page + 1, totalPages])]
    .filter(p => p >= 1 && p <= totalPages).sort((a, b) => a - b);
  container.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'btn-group btn-group-sm flex-wrap';
  let html = `<button class="btn btn-outline-secondary" data-p="${page - 1}" ${page <= 1 ? 'disabled' : ''}>«</button>`;
  pages.forEach(p => {
    html += `<button class="btn ${p === page ? 'btn-primary' : 'btn-outline-secondary'}" data-p="${p}">${p}</button>`;
  });
  html += `<button class="btn btn-outline-secondary" data-p="${page + 1}" ${page >= totalPages ? 'disabled' : ''}>»</button>`;
  html += `<span class="btn btn-outline-secondary disabled">共 ${data.total} 条</span>`;
  wrap.innerHTML = html;
  wrap.querySelectorAll('button[data-p]').forEach(b => b.addEventListener('click', () => load(Number(b.dataset.p))));
  container.appendChild(wrap);
}

/* 右上角 Toast（自动消失，可堆叠） */
function toast(msg, ok = true) {
  const wrap = document.getElementById('toastBox');
  if (!wrap) { alert(msg); return; }
  const el = document.createElement('div');
  el.className = `toast align-items-center text-bg-${ok ? 'success' : 'danger'} border-0 shadow`;
  el.setAttribute('role', 'alert');
  el.innerHTML = `<div class="d-flex"><div class="toast-body">${esc(msg)}</div>`
    + `<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
  wrap.appendChild(el);
  const t = new bootstrap.Toast(el, {delay: ok ? 4000 : 9000});
  el.addEventListener('hidden.bs.toast', () => el.remove());
  t.show();
}

/* 按钮加载态（禁用 + spinner） */
function btnLoading(btn, loading, loadingText = '处理中…') {
  if (loading) {
    btn.dataset.origHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span>${esc(loadingText)}`;
  } else {
    btn.disabled = false;
    if (btn.dataset.origHtml !== undefined) btn.innerHTML = btn.dataset.origHtml;
  }
}

/* 通用确认弹窗（替代 confirm()）：resolve true=确定 / false=取消 */
let _confirmResolver = null;
function confirmDialog({title = '确认操作', message, okText = '确定', danger = false}) {
  return new Promise(resolve => {
    _confirmResolver = resolve;
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmMessage').textContent = message;
    const ok = document.getElementById('confirmOkBtn');
    ok.textContent = okText;
    ok.className = `btn btn-sm ${danger ? 'btn-danger' : 'btn-primary'}`;
    bootstrap.Modal.getOrCreateInstance('#confirmModal').show();
  });
}
document.getElementById('confirmOkBtn').addEventListener('click', () => {
  bootstrap.Modal.getInstance('#confirmModal').hide();
  if (_confirmResolver) { _confirmResolver(true); _confirmResolver = null; }
});
document.getElementById('confirmModal').addEventListener('hidden.bs.modal', () => {
  if (_confirmResolver) { _confirmResolver(false); _confirmResolver = null; }
});

/* 通用表单弹窗（替代 prompt()）：fields=[{key,label,type,value,placeholder,help}]，取消返回 null */
let _formResolver = null;
function formDialog({title = '编辑', fields = [], submitText = '保存'}) {
  return new Promise(resolve => {
    _formResolver = resolve;
    document.getElementById('formTitle').textContent = title;
    document.getElementById('formOkBtn').textContent = submitText;
    document.getElementById('formBody').innerHTML = fields.map(f => {
      const id = 'fd_' + f.key;
      let control;
      if (f.type === 'checkbox') {
        control = `<div class="form-check form-switch">`
          + `<input class="form-check-input" type="checkbox" id="${id}" ${f.value ? 'checked' : ''}>`
          + `<label class="form-check-label" for="${id}">${esc(f.label)}</label></div>`;
      } else {
        control = `<label class="form-label small fw-semibold" for="${id}">${esc(f.label)}</label>`
          + `<input class="form-control" id="${id}" type="${f.type || 'text'}" `
          + `value="${esc(f.value ?? '')}" placeholder="${esc(f.placeholder || '')}">`;
      }
      return `<div class="mb-3">${control}${f.help ? `<div class="form-text">${esc(f.help)}</div>` : ''}</div>`;
    }).join('');
    bootstrap.Modal.getOrCreateInstance('#formModal').show();
  });
}
document.getElementById('formOkBtn').addEventListener('click', () => {
  const values = {};
  document.querySelectorAll('#formBody [id^="fd_"]').forEach(el => {
    values[el.id.slice(3)] = el.type === 'checkbox' ? el.checked : el.value;
  });
  bootstrap.Modal.getInstance('#formModal').hide();
  if (_formResolver) { _formResolver(values); _formResolver = null; }
});
document.getElementById('formModal').addEventListener('hidden.bs.modal', () => {
  if (_formResolver) { _formResolver(null); _formResolver = null; }
});

/* 空状态行 */
function emptyRow(cols, text = '暂无数据', icon = 'bi-inbox') {
  return `<tr><td colspan="${cols}"><div class="empty-state"><i class="bi ${icon}"></i>${esc(text)}</div></td></tr>`;
}

/* 复制文本到剪贴板（带移动端降级 + 提示）；返回是否成功 */
async function copyText(text, label = '已复制') {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      // 非 HTTPS 降级：临时 textarea + execCommand
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    toast(label);
    return true;
  } catch (e) {
    toast('复制失败', false);
    return false;
  }
}

/* 把某 DOM 元素渲染成「可点击复制」的省略链接：
   el: 元素，text: 完整文本，maxW: 最大宽度(如 220px) */
function makeCopyable(el, text) {
  el.classList.add('copyable');
  el.title = '点击复制：' + text;
  el.addEventListener('click', () => copyText(text));
}

/* 退出登录 */
document.getElementById('logoutBtn')?.addEventListener('click', async () => {
  try { await fetch('/api/admin/logout', {method: 'POST'}); } catch (e) {}
  location.href = '/admin/login';
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
