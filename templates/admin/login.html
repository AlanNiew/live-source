{% extends "admin/base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4 col-lg-3">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="card-title text-center mb-4">HNTV 管理后台</h4>
        {% if disabled %}
        <div class="alert alert-warning mb-0">
          管理功能未启用：请在 <code>.env</code> 配置 <code>ADMIN_PASSWORD</code> 后重启服务。
        </div>
        {% else %}
        <div id="alertBox"></div>
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label" for="password">管理密码</label>
            <input type="password" class="form-control" id="password" autocomplete="current-password" required autofocus>
          </div>
          <button type="submit" class="btn btn-primary w-100">登 录</button>
        </form>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  try {
    await api('/api/admin/login', 'POST', {password: document.getElementById('password').value});
    location.href = '/admin';
  } catch (err) {
    toast(err.message, false);
    btn.disabled = false;
  }
});
</script>
{% endblock %}
