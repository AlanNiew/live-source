{% extends "admin/base.html" %}
{% block title %}日志{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-between mb-3">
  <div>
    <div class="page-title"><i class="bi bi-journal-text me-2 text-primary"></i>日志</div>
    <div class="text-secondary small">普通日志仅 WARNING+ 入库；INFO 级为关键事件（服务启停 / 聚合完成 / 告警结果 / 管理操作审计）</div>
  </div>
</div>

<div class="card mb-3">
  <div class="card-body py-2">
    <form class="row g-2 align-items-center" id="filterForm">
      <div class="col-auto">
        <select class="form-select form-select-sm" id="levelSelect">
          <option value="">全部级别</option>
          <option value="ERROR">ERROR</option>
          <option value="WARNING">WARNING</option>
          <option value="INFO">INFO（关键事件）</option>
        </select>
      </div>
      <div class="col-md-4">
        <div class="input-group input-group-sm">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input class="form-control" id="qInput" placeholder="关键词（内容/模块）…">
        </div>
      </div>
      <div class="col-auto">
        <button class="btn btn-sm btn-primary" type="submit"><i class="bi bi-search me-1"></i>查询</button>
      </div>
    </form>
  </div>
</div>

<div class="card">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead><tr><th>时间</th><th>级别</th><th class="d-none d-md-table-cell">模块</th><th>内容</th></tr></thead>
        <tbody id="logsBody"><tr><td colspan="4" class="text-center text-secondary">加载中…</td></tr></tbody>
      </table>
    </div>
    <div class="p-3" id="pagerBox"></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
let page = 1;
const pageSize = 50;

function levelBadge(l) {
  return {'ERROR': '<span class="badge text-bg-danger">ERROR</span>',
          'WARNING': '<span class="badge text-bg-warning">WARNING</span>',
          'INFO': '<span class="badge text-bg-info">INFO</span>'}[l]
      || `<span class="badge text-bg-secondary">${esc(l)}</span>`;
}

async function load() {
  try {
    const level = document.getElementById('levelSelect').value;
    const q = encodeURIComponent(document.getElementById('qInput').value.trim());
    const data = await api(`/api/admin/logs?page=${page}&page_size=${pageSize}&level=${level}&q=${q}`);
    const tb = document.getElementById('logsBody');
    tb.innerHTML = data.items.length ? data.items.map(r => `
      <tr>
        <td class="text-nowrap small">${esc(r.ts)}</td>
        <td>${levelBadge(r.level)}</td>
        <td class="d-none d-md-table-cell"><span class="badge text-bg-light border">${esc(r.module)}</span></td>
        <td class="text-ellipsis text-ellipsis-md" data-copy="${esc(r.message)}" title="点击复制">${esc(r.message)}</td>
      </tr>`).join('') : emptyRow(4, '暂无日志', 'bi-journal-text');
    tb.querySelectorAll('[data-copy]').forEach(td => makeCopyable(td, td.dataset.copy));
    renderPager(document.getElementById('pagerBox'), data, p => { page = p; load(); });
  } catch (err) {
    toast(err.message, false);
  }
}

document.getElementById('filterForm').addEventListener('submit', (e) => {
  e.preventDefault();
  page = 1;
  load();
});

load();
</script>
{% endblock %}
