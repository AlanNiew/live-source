version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.prod
    container_name: hntv-api
    ports:
      - "15002:5002"
    environment:
      - ENV=production
      - TZ=Asia/Shanghai
      - GUNICORN_WORKERS=1
    restart: unless-stopped
    volumes:
      # 持久化缓存/管理数据：admin.db（源配置/覆盖/监控历史/日志）、
      # app.log、aggregated.m3u 等全部在 xml_data/，挂载后容器重建不丢数据
      - ../xml_data:/app/xml_data
    networks:
      - hntv-network

networks:
  hntv-network:
    driver: bridge